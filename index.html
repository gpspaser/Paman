scripttTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paman Kurir - Tanahgrogot</title>
<meta name="theme-color" content="#FFD700">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#F5F5F5;padding:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.card{background:#fff;border-radius:12px;padding:16px;text-align:center;cursor:pointer;border:2px solid transparent}
.card.active{border-color:#FFD700;background:#FFFDE7}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:9999;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.modal-content{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:500px}
.modal-content input{width:100%;padding:12px;border:1px solid #E0E0E0;border-radius:8px;margin-bottom:12px}
.modal-actions{display:flex;gap:10px;margin-top:12px}
.modal-actions button{flex:1;padding:12px;border:none;border-radius:8px;font-weight:600;cursor:pointer}
.btn-submit{background:#FFD700}
</style>
</head>
<body>

<h2>Paman Kurir</h2>
<p>Tanahgrogot - Offline</p>

<div class="grid">
  <div clalassccard="card active" onclick="openModal('belikan', this)">🛵<br>Belikan</div>
  <div class="card" onclick="openModal('antarkan', this)">🚗<br>Antarkan</div>
  <div class="card" onclick="openModal('ambilkan', this)">📦<br>Ambilkan</div>
  <div class="card" onclick="openModal('ngojek', this)">🍔<br>Ngojek</div>
  <div class="card" id="travelCard" onclick="openModal('travel', this)">✈️<br>Travel</div>
  <div class="card" onclick="openModal('nota', this)">🧾<br>Nota Digital</div>
</div>

<div class="modal" id="modal" onclick="closeModal()">
  <div class="modal-content" id="modalContent" onclick="event.stopPropagation()"></div>
</div>o
 <script>
const WA_KURIR = '6283137527300';
let layananAktif = 'belikan';

function openModal(jenis, el){
  layananAktif = jenis;
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');

  let html = '';
  
  if(jenis==='belikan'){
    html = `<h3>🛵 Form Belikan</h3>
      <input type="text" id="nama" placeholder="Nama">
      <input type="tel" id="wa" placeholder="No WhatsApp">
      <input type="text" id="antar" placeholder="Antar ke Alamat">
      <label style="font-size:13px;color:#666;margin:8px 0;display:block">List Belanjaan:</label>`;
    for(let i=1;i<=10;i++){
      html += `<input type="text" id="item${i}" placeholder="Item ${i}">`;
    }
  }
  
  if(jenis==='antarkan'){
    html = `<h3>🚗 Form Antarkan</h3>
      <input type="text" id="nama" placeholder="Nama Pengirim">
      <input type="tel" id="wa" placeholder="No WhatsApp">
      <input type="text" id="antar" placeholder="Antar ke Alamat">
      <textarea id="keterangan" placeholder="Keterangan Barang" rows="3"></textarea>`;
  }
  
  if(jenis==='ambilkan'){
    html = `<h3>📦 Form Ambilkan</h3>
      <input type="text" id="nama" placeholder="Nama Penerima">
      <input type="tel" id="wa" placeholder="No WhatsApp">
      <input type="text" id="ambil" placeholder="Ambil di Toko/Alamat">
      <input type="tel" id="waPenjual" placeholder="No WA Penjual">
      <textarea id="catatan" placeholder="Catatan Pesanan" rows="3"></textarea>`;
  }
  
  if(jenis==='ngojek'){
    html = `<h3>🍔 Form Ngojek</h3>
      <input type="text" id="nama" placeholder="Nama">
      <input type="tel" id="wa" placeholder="No WhatsApp">
      <input type="text" id="jemput" placeholder="Jemput di">
      <input type="text" id="tujuan" placeholder="Tujuan ke">`;
  }
  
  if(jenis==='travel'){
    html = `<h3>✈️ Form Travel</h3>
      <input type="text" id="nama" placeholder="Nama">
      <input type="tel" id="wa" placeholder="No WhatsApp">
      <input type="text" id="jemput" placeholder="Jemput di">
      <input type="text" id="tujuan" placeholder="Tujuan ke">
      <input type="number" id="penumpang" placeholder="Jumlah Penumpang" min="1">
      <textarea id="catatan" placeholder="Catatan" rows="2"></textarea>`;
  }
  
  if(jenis==='nota'){
    html = `<h3>🧾 Nota Digital</h3>
      <input type="text" id="toko" placeholder="Nama Toko" value="Paman Kurir">
      <input type="text" id="pelanggan" placeholder="Nama Pelanggan">
      <input type="tel" id="waPel" placeholder="No WA Pelanggan">
      <div id="listNota">
        <div class="item-list">
          <input type="text" placeholder="Produk">
          <input type="number" placeholder="Harga">
          <input type="number" placeholder="Qty" value="1">
        </div>
      </div>
      <button type="button" class="btn-tambah" onclick="alert('Fitur tambah item bisa ditambah nanti')">+ Tambah Item</button>
      <div style="font-weight:700;margin:12px 0">Total: Rp 0</div>`;
  }

  html += `<div class="modal-actions">
    <button class="btn-batal" onclick="closeModal()">Batal</button>
    <button class="btn-submit" onclick="kirimKeWA()">Kirim ke WhatsApp</button>
  </div>`;

  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modal').classList.add('show');
  
  // Auto isi nama & WA kalau pernah isi
  document.getElementById('nama').value = localStorage.getItem('nama') || '';
  document.getElementById('wa').value = localStorage.getItem('wa') || '';
}

function closeModal(){
  document.getElementById('modal').classList.remove('show');
}

function kirimKeWA(){
  const nama = document.getElementById('nama')?.value;
  const wa = document.getElementById('wa')?.value;
  
  if(!nama || !wa){
    alert('Nama dan No WhatsApp wajib diisi!');
    return;
  }

  let pesan = `*🚚 ORDER PAMAN KURIR*%0A`;
  pesan += `Layanan: ${layananAktif.toUpperCase()}%0A`;
  pesan += `Nama: ${nama}%0A`;
  pesan += `WA: ${wa}%0A`;

  if(layananAktif === 'belikan'){
    pesan += `Antar ke: ${document.getElementById('antar')?.value}%0A`;
    pesan += `List Belanjaan:%0A`;
    for(let i=1; i<=10; i++){
      const item = document.getElementById(`item${i}`)?.value;
      if(item) pesan += `- ${item}%0A`;
    }
  }
  
  if(layananAktif === 'antarkan'){
    pesan += `Antar ke: ${document.getElementById('antar')?.value}%0A`;
    pesan += `Keterangan: ${document.getElementById('keterangan')?.value}%0A`;
  }
  
  if(layananAktif === 'ambilkan'){
    pesan += `Ambil di: ${document.getElementById('ambil')?.value}%0A`;
    pesan += `WA Penjual: ${document.getElementById('waPenjual')?.value}%0A`;
    pesan += `Catatan: ${document.getElementById('catatan')?.value}%0A`;
  }
  
  if(layananAktif === 'ngojek'){
    pesan += `Jemput di: ${document.getElementById('jemput')?.value}%0A`;
    pesan += `Tujuan: ${document.getElementById('tujuan')?.value}%0A`;
  }
  
  if(layananAktif === 'travel'){
    pesan += `Jemput di: ${document.getElementById('jemput')?.value}%0A`;
    pesan += `Tujuan: ${document.getElementById('tujuan')?.value}%0A`;
    pesan += `Penumpang: ${document.getElementById('penumpang')?.value}%0A`;
    pesan += `Catatan: ${document.getElementById('catatan')?.value}%0A`;
  }

  pesan += `%0AMohon segera diproses. Terima kasih 🙏`;

  localStorage.setItem('nama', nama);
  localStorage.setItem('wa', wa);
  
  closeModal();
  window.open(`https://wa.me/${WA_KURIR}?text=${pesan}`, '_blank');
}
 </script> 
</body>
</html>
